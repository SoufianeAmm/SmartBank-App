# Intégration continue SmartBank
# Se lance sur chaque Pull Request et chaque push sur main.
# Une PR ne doit être mergée que si les 3 jobs sont verts.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Si on pousse un nouveau commit sur la même PR, on annule l'ancien run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Maven build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build & tests (tous les modules)
        run: ./mvnw -B -ntp verify

      - name: Rapports de tests (si échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

  frontend:
    name: Frontend (Angular build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installation des dépendances
        run: npm ci

      - name: Tests unitaires
        run: npx ng test --watch=false --browsers=ChromeHeadless

      - name: Build production
        run: npx ng build

  docker-compose:
    name: Docker Compose (validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la syntaxe de docker-compose.yml
        run: docker compose --profile apps config --quiet
