# =====================================================================
# SmartBank - environnement complet
#
#   Infra seule (pour lancer les services depuis l'IDE) :
#       docker compose up -d
#   Tout l'environnement (après ./mvnw package -DskipTests) :
#       docker compose --profile apps up -d --build
# =====================================================================

x-spring-app: &spring-app
  profiles: ["apps"]
  build:
    context: .
  restart: on-failure
  environment: &spring-env
    CONFIG_SERVER_URL: http://config-server:8888
    EUREKA_URL: http://discovery-server:8761/eureka
    DB_HOST: postgres
    KAFKA_BOOTSTRAP: kafka:29092
    KEYCLOAK_URL: http://keycloak:8080
    KEYCLOAK_ISSUER: http://localhost:8180/realms/smartbank
  depends_on: &spring-deps
    config-server:
      condition: service_healthy
    discovery-server:
      condition: service_started
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy

services:
  # ------------------------------------------------------------ infrastructure
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartbank
      POSTGRES_PASSWORD: smartbank
      POSTGRES_DB: smartbank
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartbank"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: start-dev --import-realm
    ports:
      - "8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Les tokens ont toujours l'issuer "localhost:8180", même quand un conteneur
      # appelle Keycloak via http://keycloak:8080
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"   # interface web
      - "1025:1025"   # SMTP

  # ------------------------------------------------------------ socle Spring Cloud
  config-server:
    <<: *spring-app
    build:
      context: .
      args:
        MODULE: infrastructure/config-server
    ports:
      - "8888:8888"
    depends_on: {}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8888'"]
      interval: 5s
      retries: 20

  discovery-server:
    <<: *spring-app
    build:
      context: .
      args:
        MODULE: infrastructure/discovery-server
    ports:
      - "8761:8761"
    depends_on: {}

  api-gateway:
    <<: *spring-app
    build:
      context: .
      args:
        MODULE: infrastructure/api-gateway
    ports:
      - "8080:8080"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_started

  # ------------------------------------------------------------ microservices métier
  customer-service:
    <<: *spring-app
    build:
      context: .
      args:
        MODULE: services/customer-service

  account-service:
    <<: *spring-app
    build:
      context: .
      args:
        MODULE: services/account-service

  transaction-service:
    <<: *spring-app
    build:
      context: .
      args:
        MODULE: services/transaction-service
    environment:
      <<: *spring-env
      STATEMENTS_DIR: /data/statements
    volumes:
      - statements:/data/statements

  transfer-service:
    <<: *spring-app
    build:
      context: .
      args:
        MODULE: services/transfer-service

  loan-service:
    <<: *spring-app
    build:
      context: .
      args:
        MODULE: services/loan-service

  notification-service:
    <<: *spring-app
    build:
      context: .
      args:
        MODULE: services/notification-service
    environment:
      <<: *spring-env
      MAIL_HOST: mailpit

volumes:
  postgres-data:
  statements:
