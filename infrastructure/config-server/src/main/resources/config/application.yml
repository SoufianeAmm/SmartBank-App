# =====================================================================
# Configuration PARTAGÉE par tous les services (servie par le Config Server).
# Les valeurs ${VAR:defaut} permettent de surcharger via variables d'env
# (docker-compose) tout en gardant des valeurs "localhost" pour le dev en IDE.
# =====================================================================

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${smartbank.db-name}
    username: ${DB_USER:smartbank}
    password: ${DB_PASSWORD:smartbank}
  data:
    web:
      pageable:
        # JSON stable pour Angular : { content: [...], page: { size, number, totalElements, totalPages } }
        serialization-mode: via-dto
  jpa:
    open-in-view: false
    hibernate:
      # TODO : passer à "validate" + Flyway quand les modèles seront stables
      ddl-auto: update

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.smartbank.common.events

  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer = URL vue par le navigateur ; jwk-set-uri = URL vue par le conteneur
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/smartbank}
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/smartbank/protocol/openid-connect/certs

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
        # Une erreur métier (404, solde insuffisant...) n'est pas une panne du service distant
        ignore-exceptions:
          - com.smartbank.common.web.ResourceNotFoundException
          - com.smartbank.common.web.BusinessException
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms
        ignore-exceptions:
          - com.smartbank.common.web.ResourceNotFoundException
          - com.smartbank.common.web.BusinessException

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,refresh
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
